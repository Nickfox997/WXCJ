name: build-dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # 用 Linux runner：Theos 完整支持，额度消耗是 macOS 的 1/10
    # （macOS arm64 runner 在免费账号下不支持，勿改回 macos-14）
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: bash scripts/wsl-setup.sh

      - name: Build
        run: bash scripts/build-here.sh

      - name: Verify artifact
        run: |
          set -e
          ls -lh libmarsbridge.dylib
          file libmarsbridge.dylib
          lipo -info libmarsbridge.dylib || true

      - uses: actions/upload-artifact@v4
        with:
          name: libmarsbridge
          path: libmarsbridge.dylib
          if-no-files-found: error
          retention-days: 14
